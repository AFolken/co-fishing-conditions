services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fishing
      POSTGRES_USER: fishing
      POSTGRES_PASSWORD: fishing_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishing"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fishing:fishing_dev@db:5432/fishing
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    command: >
      python -m pipeline

volumes:
  pgdata:
